<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Практика</title>
</head>
<body>

<script>

  let rows = +prompt("Введіть кількість рядків");
  let cols = +prompt("Введіть кількість стовпчиків");

  let divWidth = 60;
  let divHeight = 60;

  for (let i = 0; i < rows; i++) {

    for (let j = 0; j < cols; j++) {

      let div = document.createElement("div");

      div.style.position = "absolute";

      div.style.top = i * divHeight + "px";
      div.style.left = j * divWidth + "px";

      div.style.width = divWidth + "px";
      div.style.height = divHeight + "px";

      // рандомний фон
      let r1 = Math.floor(Math.random() * 256);
      let g1 = Math.floor(Math.random() * 256);
      let b1 = Math.floor(Math.random() * 256);

      div.style.backgroundColor = "rgb(" + r1 + "," + g1 + "," + b1 + ")";

      // рандомна рамка
      let r2 = Math.floor(Math.random() * 256);
      let g2 = Math.floor(Math.random() * 256);
      let b2 = Math.floor(Math.random() * 256);

      div.style.border = "3px solid rgb(" + r2 + "," + g2 + "," + b2 + ")";

      // текст
      div.innerText = i + "," + j;

      // центрування тексту
      div.style.display = "flex";
      div.style.alignItems = "center";
      div.style.justifyContent = "center";

      document.body.appendChild(div);
    }

  }

</script>

</body>
</html>
