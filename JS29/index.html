<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ДЗ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
      text-align: center;
    }

    #cat-image {
      display: block;
      margin: 20px auto;
      max-width: 400px;
      max-height: 400px;
      border: 2px solid #333;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>

<h1>Галерея котиків</h1>

<img id="cat-image" src="" alt="Завантаження котика">

<br>
<button id="prevBtn" onclick="showPrevious()">previous</button>
<button id="nextBtn" onclick="showNext()">next</button>

<script>
  let catHistory = [];
  let currentIndex = -1;

  const catImgTag = document.getElementById('cat-image');
  const prevBtn = document.getElementById('prevBtn');

  function fetchRandomCatImage() {

    fetch('https://api.thecatapi.com/v1/images/search')
      .then(response => {
        if (!response.ok)
          throw new Error('Помилка сервера The Cat API');
        return response.json();
      })
      .then(data => {
        const catUrl = data[0].url;

        catHistory.push(catUrl);
        currentIndex = catHistory.length - 1;

        displayImage();
      })
      .catch(error => {
        console.error('Сталася помилка при отриманні котика:', error);
      });
  }

  function displayImage() {
    catImgTag.src = catHistory[currentIndex];

    if (currentIndex <= 0) {
      prevBtn.disabled = true;
    } else {
      prevBtn.disabled = false;
    }
  }

  function showNext() {
    if (currentIndex < catHistory.length - 1) {
      currentIndex++;
      displayImage();
    } else {
      fetchRandomCatImage();
    }
  }

  function showPrevious() {
    if (currentIndex > 0) {
      currentIndex--;
      displayImage();
    }
  }

  fetchRandomCatImage();
</script>

</body>
</html>
