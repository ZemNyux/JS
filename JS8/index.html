<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>

<h1>Практика</h1>

<script>
  window.addEventListener('wheel', function(e) {
    if (e.deltaY > 0) {
      console.log("ВНИЗ");
    }
    else if (e.deltaY < 0) {
      console.log("ВВЕРХ");
    }

  });
</script>

</body>
</html>
