<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DZ4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .image {
      width: 100%;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: white;
      font-weight: bold;
    }

    .info {
      padding: 12px;
    }

    .name {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      min-height: 32px;
    }

    .rating {
      color: #ffc107;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .prices {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .old-price {
      text-decoration: line-through;
      color: #999;
      font-size: 12px;
    }

    .new-price {
      color: #e74c3c;
      font-weight: bold;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 8px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Магазин товарів</h1>
  <div class="products" id="products"></div>
</div>

<script>
  var tovar = [
    {name: "Ноутбук", rating: 5, oldPrice: 15000, newPrice: 12000},
    {name: "Навушники", rating: 4, oldPrice: 2000, newPrice: 1500},
    {name: "Смартфон", rating: 5, oldPrice: 8000, newPrice: 6500},
    {name: "Планшет", rating: 4, oldPrice: 5000, newPrice: 3800},
    {name: "Монітор", rating: 5, oldPrice: 3500, newPrice: 2800},
    {name: "Клавіатура", rating: 4, oldPrice: 1200, newPrice: 900},
    {name: "Миша", rating: 5, oldPrice: 800, newPrice: 550},
    {name: "Веб-камера", rating: 4, oldPrice: 1500, newPrice: 1200},
    {name: "SSD 1TB", rating: 5, oldPrice: 4000, newPrice: 3200},
    {name: "Чохол", rating: 4, oldPrice: 300, newPrice: 200},
    {name: "Зарядка", rating: 5, oldPrice: 600, newPrice: 450},
    {name: "Кабель", rating: 4, oldPrice: 150, newPrice: 99},
    {name: "Повербанк", rating: 5, oldPrice: 1800, newPrice: 1400},
    {name: "Штатив", rating: 4, oldPrice: 400, newPrice: 280},
    {name: "LED лампа", rating: 4, oldPrice: 250, newPrice: 180},
    {name: "Вентилятор", rating: 5, oldPrice: 900, newPrice: 650},
    {name: "USB хаб", rating: 4, oldPrice: 500, newPrice: 350},
    {name: "Охолоджувач", rating: 5, oldPrice: 1200, newPrice: 900},
    {name: "Протектор", rating: 4, oldPrice: 200, newPrice: 120},
    {name: "Скло захисне", rating: 5, oldPrice: 180, newPrice: 100},
    {name: "Наушники TWS", rating: 4, oldPrice: 3000, newPrice: 2200},
    {name: "Мікрофон", rating: 5, oldPrice: 2500, newPrice: 1900},
    {name: "Динаміки", rating: 4, oldPrice: 1600, newPrice: 1200},
    {name: "Джойстик", rating: 5, oldPrice: 2000, newPrice: 1500},
    {name: "HDMI кабель", rating: 4, oldPrice: 300, newPrice: 200}
  ];

  function getRandomColor() {
    var colors = ["#FF6B6B", "#4ECDC4", "#45B7D1", "#FFA07A", "#98D8C8"];
    var randomIndex = Math.floor(Math.random() * colors.length);
    return colors[randomIndex];
  }

  function createCard(imageUrl, tovarName, rating, oldPrice, newPrice) {
    var container = document.getElementById("products");

    var card = document.createElement("div");
    card.className = "card";

    var imageDiv = document.createElement("div");
    imageDiv.className = "image";

    var bgColor = getRandomColor();
    imageDiv.style.backgroundColor = bgColor;

    card.appendChild(imageDiv);

    var info = document.createElement("div");
    info.className = "info";

    var nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = tovarName;
    info.appendChild(nameDiv);

    var ratingDiv = document.createElement("div");
    ratingDiv.className = "rating";

    var pricesDiv = document.createElement("div");
    pricesDiv.className = "prices";

    var oldPriceDiv = document.createElement("span");
    oldPriceDiv.className = "old-price";
    oldPriceDiv.textContent = oldPrice + "₴";
    pricesDiv.appendChild(oldPriceDiv);

    var newPriceDiv = document.createElement("span");
    newPriceDiv.className = "new-price";
    newPriceDiv.textContent = newPrice + "₴";
    pricesDiv.appendChild(newPriceDiv);

    info.appendChild(pricesDiv);

    var btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = "У кошик";
    info.appendChild(btn);

    card.appendChild(info);

    container.appendChild(card);
  }

  for (var j = 0; j < tovar.length; j++) {
    createCard(
      "url",
      tovar[j].name,
      tovar[j].rating,
      tovar[j].oldPrice,
      tovar[j].newPrice
    );
  }
</script>

</body>
</html>
